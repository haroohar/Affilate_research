archers, and help shape the next generation of AI systems in your area of expertise.\n\nEarn up to $1,920 by referring\nShare the referral link below, and earn up to $1,920 for each successful referral through this unique link. Referral limits apply. See the Referral Policy (https://talent.docs.mercor.com/policies/referrals) for current limits."}, {"group": "ML & AI research", "title": "GPU Kernel Expert", "url": "https://work.mercor.com/jobs/list_AAABoDrLqkDg31vugrpECa5L", "pay": "$70–$90/hr", "rateMax": 90.0, "location": "Remote — United States", "commitment": "hourly", "hours": 40, "slots": 3, "posted": "2026-08-25", "referral": 1440.0, "text": "Evaluate the quality, correctness, and completeness of GPU/accelerator kernel development tasks used to train and evaluate a frontier AI lab's models. You'll assess numerical correctness, performance-benchmarking fairness, task scoping, and compilation/runtime validity across diverse kernel task types — and provide clear, rubric-based written feedback.\n\nBasic Qualifications\n• 3+ years of hands-on experience developing, optimizing, or verifying GPU/accelerator kernels in at least two of: CUDA, Triton, NKI, or Pallas (JAX)\n• Strong understanding of numerical-correctness criteria for kernels (absolute/relative/ULP tolerances, reference-implementation selection)\n• Demonstrated experience with performance profiling and benchmarking (nsight, ncu, roofline analysis, or framework-native profilers)\n• Familiarity with common compilation and runtime failure modes (driver mismatches, OOM, launch-configuration errors, shape/stride mismatches, autotuning failures)\n• Experience with at least three kernel task types: generation from specification, translation/lowering across frameworks, migration between hardware targets, debugging, performance optimization, or operator fusion\n\nPreferred Qualifications\n• Experience across both NVIDIA GPU (CUDA/Triton) and custom-accelerator (NKI/Pallas/TPU) ecosystems\n• Background in compiler const groups = [...new Set(JOBS.map(j => j.group))];
let active = 'All', query = '', allOpen = true;
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const slug = (j, i) => 'job-' + i;
const render = md => {
  // Site-added footer lines are plain text; give its section labels heading weight.
  md = md.replace(/^(Contract and Payment Terms|About Mercor)$/gm, '\n### $1\n');
  md = md.replace(/^(Earn (up to \$[\d,]+|rewards) by referring)$/gm, '\n### $1\n');
  const html = window.marked ? marked.parse(md, { breaks: true }) : '<pre style="white-space:pre-wrap">' + esc(md) + '</pre>';
  return window.DOMPurify ? DOMPurify.sanitize(html) : html;
};
function chips() {
  const el = document.getElementById('chips');
  el.innerHTML = ['All', ...groups].map(g => {
    const n = g === 'All' ? JOBS.length : JOBS.filter(j => j.group === g).length;
    return `<button class="chip" type="button" aria-pressed="${g === active}" data-g="${esc(g)}">${esc(g)} · ${n}</button>`;
  }).join('');
  el.querySelectorAll('button').forEach(b => b.onclick = () => { active = b.dataset.g; chips(); draw(); });
}
function draw() {
  const q = query.toLowerCase();
  const shown = JOBS.map((j, i) => ({ j, i })).filter(({ j }) =>
    (active === 'All' || j.group === active) && (!q || (j.title + ' ' + j.text).toLowerCase().includes(q)));
  const list = document.getElementById('list'), nav = document.getElementById('nav');
  if (!shown.length) { list.innerHTML = '<p class="empty">No postings match. Clear the search or pick another group.</p>'; nav.innerHTML = ''; return; }
  let html = '', navh = '', last = null;
  for (const { j, i } of shown) {
    if (j.group !== last) { html += `<h2 class="grouphead">${esc(j.group)}</h2>`; navh += `<h3>${esc(j.group)}</h3>`; last = j.group; }
    const meta = [j.commitment, j.location, j.hours ? j.hours + ' hrs/wk' : null,
      j.slots != null ? j.slots + ' openings left' : null, 'Posted ' + j.posted].filter(Boolean);
    html += `<article id="${slug(j, i)}"><details${allOpen ? ' open' : ''}><summary>
      <div class="titlerow"><h2>${esc(j.title)}</h2><span class="pay">${esc(j.pay)}</span></div>
      <div class="meta">${meta.map(m => `<span>${esc(m)}</span>`).join('')}</div>
      <span class="toggle"><span class="o">Show full posting</span><span class="c">Hide posting</span></span>
      </summary><div class="body" data-i="${i}"></div></details></article>`;
    navh += `<a href="#${slug(j, i)}">${esc(j.title)}<span>${esc(j.pay)}</span></a>`;
  }
  list.innerHTML = html; nav.innerHTML = navh;
  list.querySelectorAll('details').forEach(d => {
    const fill = () => { const b = d.querySelector('.body'); if (!b.dataset.done) { const j = JOBS[+b.dataset.i];
      b.innerHTML = render(j.text) + `<a class="applylink" href="${esc(j.url)}" target="_blank" rel="noopener">Open on Mercor ↗</a>`; b.dataset.done = 1; } };
    if (d.open) fill(); d.addEventListener('toggle', () => d.open && fill());
  });
  nav.querySelectorAll('a').forEach(a => a.addEventListener('click', () => { const d = document.querySelector(a.getAttribute('href') + ' details'); if (d) d.open = true; }));
}
document.getElementById('q').addEventListener('input', e => { query = e.target.value.trim(); draw(); });
document.getElementById('expand').onclick = e => { allOpen = !allOpen; e.target.textContent = allOpen ? 'Collapse all' : 'Expand all'; draw(); };
chips(); draw();
